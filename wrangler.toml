# Heatshift's own Worker. Nothing here is shared with kinetic or any other
# app: its own script name, workers.dev URL, Durable Object namespace and
# storage. It has no routes, KV, D1 or R2 bindings borrowed from elsewhere.
name = "heatshift"
workers_dev = true
main = "worker/index.ts"
compatibility_date = "2026-08-24"

# Serves the Vite build output; the Worker runs first for every request so
# it can handle /api/* (lobby creation and WebSocket upgrades) and hand
# everything else to the static assets, with an SPA fallback for /join/CODE.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# One Durable Object per lobby: it owns the lobby's players, the current
# round and every live WebSocket connected to it.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Different local ports from kinetic (8788/9229) so both can run side by side.
[dev]
port = 8789
inspector_port = 9230
